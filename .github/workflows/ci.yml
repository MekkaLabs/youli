name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Typecheck (workspaces)
        run: npm run typecheck --workspaces --if-present

      - name: Build API (produção)
        run: npm run build -w @youli/api
        env:
          # Segredo dummy só para o build não falhar no gate de produção do auth.
          YOULI_SESSION_SECRET: ci-dummy-secret-not-used-at-runtime-0000000000
